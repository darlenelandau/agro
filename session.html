const ABBR={"Понедельник":"Пн","Вторник":"Вт","Среда":"Ср","Четверг":"Чт","Пятница":"Пт","Суббота":"Сб"};
const pl=n=>n+(n===1?" пара":n<5?" пары":" пар");
const toDate=(iso,t)=>{const [h,m]=t.split(".");return new Date(iso+"T"+h.padStart(2,"0")+":"+m+":00");};

function blockHTML(d,b){
  const n = b.from===b.to ? `${b.from} пара` : `${b.from}-${b.to} пары`;
  const kind = KIND[b.kind]??b.kind;
  return `<div class="blk${isExam(b.kind)?" exam":""}" data-s="${b.subj}" style="--c:${col(b.subj)}">
    <div class="tm">${b.start}-${b.end}<small>${n}</small></div>
    <div><span class="sj">${b.subj}</span>${kind?`<span class="badge">${kind}</span>`:""}${b.note?`<span class="badge mv">↪ ${b.note}</span>`:""}
      <div class="meta">${b.teacher}${b.sub?" · "+b.sub:""}</div></div>
    <div class="room">${roomTxt(b.room)}</div></div>`;
}

// дни
let html="", wk=0;
DAYS.forEach((d,i)=>{
  if (i%6===0){ wk++; html+=`<div class="week">Неделя ${wk} · ${wk%2?"нечётная":"чётная"}</div>`; }
  const cls = d.date<todayISO?" past":d.date===todayISO?" today":"";
  html+=`<div class="day${cls}" id="d${d.date}"><div class="dh"><b>${d.name}, ${fmt(d.date)}</b><span>${d.blocks.length?pl(d.pairs.length)+" · "+d.blocks[0].start+"-"+d.blocks.at(-1).end:""}</span></div>`;
  if(!d.blocks.length) html+=`<div class="free">Занятий нет</div>`;
  d.moved.forEach(m=>html+=`<div class="moved"><s>${m.time} · ${m.n} пара · ${m.subj}</s> → ${m.moved}</div>`);
  d.blocks.forEach((b,j)=>{
    if (j>0 && b.from>d.blocks[j-1].to+1) html+=`<div class="gap">окно ${d.blocks[j-1].end}-${b.start}</div>`;
    html+=blockHTML(d,b);
  });
  html+=`</div>`;
});
document.getElementById("days").innerHTML=html;
document.getElementById("daynav").innerHTML = DAYS.map(d=>{
  const c=[d.date<todayISO?"past":"", d.date===todayISO?"today":"", d.exam?"hasexam":""].join(" ");
  return `<a class="chip ${c}" href="#d${d.date}">${ABBR[d.name]} ${+d.date.slice(8)}${d.exam?" ★":""}</a>`;
}).join("");

// фильтр по предмету
const subjects=[...new Set(DAYS.flatMap(d=>d.pairs.map(p=>p.subj)))];
let active=null;
const filter=document.getElementById("filter");
filter.innerHTML=subjects.map(s=>`<span class="chip" data-s="${s}"><i style="background:${col(s)}"></i>${SHORT[s]||s}</span>`).join("");
filter.onclick=e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  active = active===c.dataset.s ? null : c.dataset.s;
  filter.querySelectorAll(".chip").forEach(x=>x.classList.toggle("off",active&&x.dataset.s!==active));
  document.querySelectorAll("#days .blk").forEach(x=>x.classList.toggle("dim",active&&x.dataset.s!==active));
};

// экзамены
const exams=DAYS.flatMap(d=>d.blocks.filter(b=>isExam(b.kind)).map(b=>({...b,date:d.date,day:d.name})));
const daysLeft=iso=>Math.round((new Date(iso)-new Date(todayISO))/864e5);
document.getElementById("v-exams").innerHTML = `<p class="sub">${exams.filter(e=>/Экзамен/.test(e.kind)).length} экзамена и ${exams.filter(e=>/Зачет/.test(e.kind)).length} зачётов, все в последнюю неделю.</p>`+
  exams.map(e=>{const l=daysLeft(e.date);return `<div class="row${l<0?" past":""}" style="--c:${col(e.subj)}">
    <div><div class="big">${fmt(e.date)}</div><div class="meta">${e.day}, ${e.start}</div></div>
    <div><span class="sj">${e.subj}</span><span class="badge" style="background:var(--exam);color:#fff">${KIND[e.kind]}</span><div class="meta">${e.teacher}</div></div>
    <div class="room">${roomTxt(e.room)}${l>=0?`<div class="cnt">${l===0?"сегодня":"через "+l+" дн."}</div>`:""}</div></div>`}).join("");

// по предметам
document.getElementById("v-subjects").innerHTML = subjects.filter(s=>s!=="Общее собрание").map(s=>{
  const items=DAYS.flatMap(d=>d.blocks.filter(b=>b.subj===s).map(b=>({...b,date:d.date,day:d.name})));
  const fin=items.filter(b=>isExam(b.kind));
  const teachers=[...new Set(items.map(b=>b.teacher))].join("; ");
  const cnt=k=>items.filter(b=>b.kind===k).reduce((a,b)=>a+b.to-b.from+1,0);
  const stat=[["л","лекций"],["ПЗ","практик"],["л/з","лаб."]].map(([k,w])=>cnt(k)?cnt(k)+" "+w:"").filter(Boolean).join(", ");
  return `<div class="subj" style="--c:${col(s)}"><h3>${s}</h3><div class="meta">${teachers}${stat?" · "+stat+" (пар)":""}</div>
    ${fin.map(f=>`<div class="final">${KIND[f.kind]}: ${f.day.toLowerCase()}, ${fmt(f.date)}, ${f.start}, ауд. ${f.room}</div>`).join(" ")}
    <ul>${items.filter(b=>!isExam(b.kind)).map(b=>`<li class="${b.date<todayISO?"past":""}"><a href="#d${b.date}" data-go>${fmt(b.date)}</a>, ${b.start}-${b.end} · ${KIND[b.kind]}${b.sub?" ("+b.sub+")":""} · ауд. ${b.room}${b.note?" <b>("+b.note+")</b>":""}</li>`).join("")}</ul></div>`;
}).join("");
document.getElementById("v-subjects").onclick=e=>{ if(e.target.dataset.go!==undefined) show("days"); };

// вкладки
function show(v){
  document.querySelectorAll(".tab[data-v]").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  ["days","exams","subjects"].forEach(x=>document.getElementById("v-"+x).classList.toggle("hide",x!==v));
}
document.querySelectorAll(".tab[data-v]").forEach(t=>t.onclick=()=>show(t.dataset.v));

// сейчас / дальше
(function(){
  const now=new Date(); let cur=null,next=null;
  for(const d of DAYS) for(const b of d.blocks){
    const s=toDate(d.date,b.start), e=toDate(d.date,b.end);
    if(s<=now&&now<e) cur={d,b}; else if(s>now&&!next) next={d,b};
  }
  const el=document.getElementById("now");
  const line=(x,lab)=>`<div><span class="sub">${lab}</span><b>${x.b.subj}${KIND[x.b.kind]?" · "+KIND[x.b.kind]:""}</b><span class="sub">${x.d.name}, ${fmt(x.d.date)}, ${x.b.start}-${x.b.end}, ауд. ${x.b.room}</span></div>`;
  if(cur) el.innerHTML=`<div class="dot"></div>`+line(cur,"Сейчас идёт");
  else if(next) el.innerHTML=`<div class="dot"></div>`+line(next,"Следующее занятие");
  else el.innerHTML=`<div class="dot" style="background:#16a34a"></div><div><b>Сессия позади 🎉</b></div>`;
  const t=document.getElementById("d"+todayISO); if(t) setTimeout(()=>t.scrollIntoView({block:"start"}),50);
})();

// .ics
document.getElementById("ics").onclick=()=>{
  const st=(iso,t)=>iso.replace(/-/g,"")+"T"+t.replace(".","").padStart(4,"0")+"00";
  const esc=s=>s.replace(/[,;]/g,m=>"\\"+m);
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//session//RU","CALSCALE:GREGORIAN"];
  DAYS.forEach(d=>d.blocks.forEach((b,i)=>{
    out.push("BEGIN:VEVENT",`UID:${d.date}-${b.from}@session`,`DTSTART;TZID=Europe/Moscow:${st(d.date,b.start)}`,`DTEND;TZID=Europe/Moscow:${st(d.date,b.end)}`,
      `SUMMARY:${esc((isExam(b.kind)?"❗ "+KIND[b.kind].toUpperCase()+": ":"")+(SHORT[b.subj]||b.subj)+(KIND[b.kind]&&!isExam(b.kind)?" ("+KIND[b.kind]+")":""))}`,
      `LOCATION:${esc("ауд. "+b.room)}`,`DESCRIPTION:${esc((b.note?b.note+". ":"")+b.teacher+(b.sub?" · "+b.sub:""))}`,"END:VEVENT");
  }));
  out.push("END:VCALENDAR");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out.join("\r\n")],{type:"text/calendar"}));
  a.download="сессия_ноябрь_2026.ics"; a.click();
};
</script>
</body>
</html>
